<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title description">
  <title id="title">Mini Git 설명 영상</title>
  <desc id="description">커밋 그래프와 재생 버튼이 있는 영상 표지. README에서 클릭하면 약 5분 분량의 MP4 파일을 열 수 있습니다.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#162e43"/>
      <stop offset="100%" stop-color="#244e60"/>
    </linearGradient>
    <marker id="parentArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#98b7c8"/>
    </marker>
  </defs>
  <rect width="1200" height="520" rx="28" fill="url(#background)"/>
  <g font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
    <rect x="64" y="54" width="178" height="38" rx="19" fill="#244e60" stroke="#75d5bc"/>
    <text x="153" y="80" text-anchor="middle" fill="#a7f0dc" font-size="20" font-weight="600">프로젝트 설명 영상</text>
    <text x="64" y="183" fill="#ffffff" font-size="76" font-weight="700">Mini Git</text>
    <text x="68" y="239" fill="#d4e5ed" font-size="30">기록을 연결하고, 탐색하고, 찾아보기</text>
    <text x="68" y="299" fill="#a9c5d2" font-size="23">커밋 그래프 · 브랜치 · BFS · 정렬 · 역색인</text>
    <rect x="68" y="365" width="300" height="63" rx="16" fill="#9be8d0"/>
    <path d="M 93 384 L 93 410 L 112 397 Z" fill="#163c3a"/>
    <text x="128" y="406" fill="#163c3a" font-size="25" font-weight="700">영상 보기 · 약 5분</text>
    <text x="70" y="473" fill="#a9c5d2" font-size="19">MP4 · 표지를 클릭해 영상을 열 수 있습니다.</text>
  </g>
  <g stroke="#98b7c8" stroke-width="4" marker-end="url(#parentArrow)">
    <path d="M 1021 181 L 914 242"/>
    <path d="M 1021 339 L 914 278"/>
  </g>
  <g font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="27" font-weight="700" text-anchor="middle">
    <rect x="822" y="225" width="92" height="70" rx="17" fill="#9be8d0"/>
    <text x="868" y="270" fill="#163c3a">A</text>
    <rect x="1021" y="130" width="92" height="70" rx="17" fill="#c9b6f2"/>
    <text x="1067" y="175" fill="#3b285b">B</text>
    <rect x="1021" y="320" width="92" height="70" rx="17" fill="#9bc4f0"/>
    <text x="1067" y="365" fill="#183c65">C</text>
  </g>
  <circle cx="972" cy="260" r="46" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.55" stroke-width="2"/>
  <path d="M 960 240 L 960 280 L 990 260 Z" fill="#ffffff"/>
</svg>
